<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0px;
            padding: 0px;
            font-family: sans-serif;
        }

        header {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #header {
            position: absolute;
            top: 50px;
            padding: 20px;
            background-color: blanchedalmond;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #header nav {
            display: flex;
            gap: 50px;
            align-items: center;
            padding: 0px 25px;
        }

        #header nav ul {
            display: flex;
            gap: 10px;
            padding: 0;
            margin: 0;
        }

        #header nav li {
            list-style: none;
        }

        #header nav li a {
            text-decoration: none;
            background-color: black;
            padding: 5px 10px;
            border-radius: 7px;
            color: #fff;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.7);
        }

        /* Hero Container */
        #mainhero {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Dark tint over the image so white text is easy to read */
        #mainhero::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }

        /* Fix: Scale the 8K image to fit the screen cleanly */
        #imagehero {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        /* Two-Column Grid Layout inside Hero */
        .hero-grid {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            justify-items: center;
            padding: 0 8%;
            gap: 30px;
        }

        .hero-text h1 {
            color: #ffffff;
            font-size: 4rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            margin: 0;
        }

        /* Big Black Pulsing Button */
        .pulse-btn {
            background-color: #000000;
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 22px 42px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            animation: pulseAnimation 1.8s infinite;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .pulse-btn:hover {
            background-color: #1a1a1a;
            transform: scale(1.05);
        }

        @keyframes pulseAnimation {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(0, 0, 0, 0.85);
            }
            70% {
                transform: scale(1.04);
                box-shadow: 0 0 0 22px rgba(0, 0, 0, 0);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
            }
        }

        @media (max-width: 768px) {
            .hero-grid {
                grid-template-columns: 1fr;
                text-align: center;
                align-content: center;
            }
            .hero-text h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div id="header">
            <nav>
                <span>WTI</span>

                <!-- ============= links ========= -->
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="about.html">About</a></li>
                </ul>
            </nav>
        </div>

        <!-- ============ hero ============ -->
        <div id="mainhero">
            <img id="imagehero" src="images/michael-myers-8k-3840x2160-15450.jpeg" alt="hero image">

            <!-- Two-Grid Overlay -->
            <div class="hero-grid">
                <div class="hero-text">
                    <h1>Dive in now!</h1>
                    <p>
                        <ul style="color: #fff; text-align: left;">
                            <li>Enthusiastic about technology?</li>
                            <li>Interested in building innovations?</li>
                            <li>Centered around learning?</li>
                            <li>Want to have a career in tech?</li>
                        </ul>
                    </p>
                </div>

                <div class="hero-action">
                    <a href="about.html" class="pulse-btn">Click me to see more</a>
                </div>
            </div>
        </div>
    </header>
</body>
</html>
